<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Composicion floral decorativa">
  <!-- Fondo crema -->
  <rect width="600" height="400" fill="#FDFCFA"/>

  <!-- Marco interior con redondeo, color crema sobre crema -->
  <rect x="26" y="26" width="548" height="348" rx="30" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- Acento dorado superior izquierdo -->
  <circle cx="148" cy="130" r="56" fill="#E8B84B" fill-opacity="0.22"/>
  <circle cx="148" cy="130" r="34" fill="#E8B84B" fill-opacity="0.32"/>

  <!-- Acento rojo (primary) inferior derecho -->
  <circle cx="450" cy="274" r="78" fill="#C0392B" fill-opacity="0.14"/>
  <circle cx="450" cy="274" r="46" fill="#C0392B" fill-opacity="0.20"/>

  <!-- Tallos verdes (accent) que cruzan la composicion -->
  <path d="M116 320C188 256 264 220 340 220C404 220 466 244 524 290" stroke="#2D5A1B" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M96 340C170 286 248 252 326 252C392 252 458 280 524 326" stroke="#2D5A1B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Hoja decorativa central izquierda -->
  <path d="M210 200C232 178 260 174 282 188C268 212 240 222 218 216C214 211 211 206 210 200Z" fill="#2D5A1B" fill-opacity="0.18"/>

  <!-- Petalos / boton dorado central -->
  <g transform="translate(310 160)">
    <circle r="18" fill="#E8B84B" fill-opacity="0.55"/>
    <circle r="10" fill="#C0392B" fill-opacity="0.55"/>
  </g>

  <!-- Triángulos sutiles en esquinas como detalle editorial -->
  <path d="M40 40 L80 40 L40 80 Z" fill="#C0392B" fill-opacity="0.14"/>
  <path d="M560 360 L520 360 L560 320 Z" fill="#2D5A1B" fill-opacity="0.18"/>
</svg>
